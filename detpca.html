<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Geometry to PCA</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 1050px;
            width: 100%;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .controls {
            flex: 1.2;
            min-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .visualization {
            flex: 1.5;
            min-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .slider-group {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .slider-group label {
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* Toggle Switch Styling */
        .toggle-container {
            display: flex;
            background: #e9ecef;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid #ced4da;
        }

        .toggle-container label {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            color: #495057;
        }

        .toggle-container input {
            display: none;
        }

        .toggle-container input:checked+span {
            color: #fff;
        }

        .radio-left:checked~.bg {
            transform: translateX(0);
        }

        .radio-right:checked~.bg {
            transform: translateX(100%);
        }

        .toggle-bg {
            position: absolute;
            background: #2c3e50;
            width: 50%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            transition: transform 0.3s ease;
        }

        .toggle-label-text {
            position: relative;
            z-index: 1;
        }

        .math-panel {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.1em;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .matrix-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Courier New', Courier, monospace;
        }

        .matrix {
            position: relative;
            display: inline-block;
            padding: 0 15px;
            text-align: center;
        }

        .matrix::before,
        .matrix::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 6px;
            border: 2px solid #ecf0f1;
        }

        .matrix::before {
            left: 0;
            border-right: none;
        }

        .matrix::after {
            right: 0;
            border-left: none;
        }

        .matrix-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 5px 0;
        }

        .matrix-cell {
            width: 55px;
            text-align: right;
        }

        .highlight-a {
            color: #e74c3c;
            font-weight: bold;
        }

        .highlight-s {
            color: #f1c40f;
            font-weight: bold;
        }

        .formula-text {
            text-align: center;
            font-size: 0.9em;
            color: #bdc3c7;
        }

        #dynTitle {
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="controls">

            <!-- Matrix Type Toggle -->
            <div
                style="position: relative; display: flex; background: #e9ecef; border-radius: 8px; overflow: hidden; border: 1px solid #ced4da; margin-bottom: 15px;">
                <div id="slideBgMatrix"
                    style="position: absolute; width: 50%; height: 100%; background: #2ecc71; transition: left 0.3s ease; left: 0;">
                </div>
                <label
                    style="flex: 1; text-align: center; padding: 10px; cursor: pointer; position: relative; z-index: 1; color: white; font-weight: bold;"
                    id="lblCov">
                    <input type="radio" name="matrixType" value="covariance" checked style="display:none;"
                        onchange="switchMatrixType()"> Covariance
                </label>
                <label
                    style="flex: 1; text-align: center; padding: 10px; cursor: pointer; position: relative; z-index: 1; color: #495057; font-weight: bold;"
                    id="lblCor">
                    <input type="radio" name="matrixType" value="correlation" style="display:none;"
                        onchange="switchMatrixType()"> Correlation
                </label>
            </div>

            <!-- Mode Toggle -->
            <div
                style="position: relative; display: flex; background: #e9ecef; border-radius: 8px; overflow: hidden; border: 1px solid #ced4da;">
                <div id="slideBg"
                    style="position: absolute; width: 50%; height: 100%; background: #3498db; transition: left 0.3s ease; left: 0;">
                </div>
                <label
                    style="flex: 1; text-align: center; padding: 10px; cursor: pointer; position: relative; z-index: 1; color: white; font-weight: bold;"
                    id="lblChol">
                    <input type="radio" name="mode" value="cholesky" checked style="display:none;"
                        onchange="switchMode()"> 1. Geometric Basis
                </label>
                <label
                    style="flex: 1; text-align: center; padding: 10px; cursor: pointer; position: relative; z-index: 1; color: #495057; font-weight: bold;"
                    id="lblEig">
                    <input type="radio" name="mode" value="eigen" style="display:none;" onchange="switchMode()"> 2. PCA
                    Loadings
                </label>
            </div>

            <div class="slider-group" id="groupVarX">
                <label>Variance X (<span style="font-family:serif;">s<sub>x</sub><sup>2</sup></span>) <span
                        id="valVarX">2.00</span></label>
                <input type="range" id="varX" min="0.1" max="5.0" step="0.1" value="2.0">
            </div>

            <div class="slider-group" id="groupVarY">
                <label>Variance Y (<span style="font-family:serif;">s<sub>y</sub><sup>2</sup></span>) <span
                        id="valVarY">2.00</span></label>
                <input type="range" id="varY" min="0.1" max="5.0" step="0.1" value="2.0">
            </div>

            <div class="slider-group">
                <label>Correlation (r) <span id="valCorr">0.50</span></label>
                <input type="range" id="corr" min="-0.99" max="0.99" step="0.01" value="0.50">
            </div>

            <div class="math-panel">
                <div class="formula-text" id="dynTitle">1. Geometric Transformation Matrix (A)</div>
                <div class="matrix-container">
                    <span id="dynSymbol">A</span> =
                    <div class="matrix">
                        <div class="matrix-row">
                            <span class="matrix-cell" id="t00" style="color:#e74c3c;">1.41</span>
                            <span class="matrix-cell" id="t01" style="color:#2ecc71;">0.00</span>
                        </div>
                        <div class="matrix-row">
                            <span class="matrix-cell" id="t10" style="color:#e74c3c;">0.71</span>
                            <span class="matrix-cell" id="t11" style="color:#2ecc71;">1.22</span>
                        </div>
                    </div>
                </div>
                <div class="formula-text">Determinant |<span id="dynDetSymbol">A</span>| = <span id="detT"
                        class="highlight-a">1.73</span> (Parallelogram Area)</div>

                <hr style="border-color: #34495e; width: 100%;">

                <div class="formula-text"><span id="matrixTitle">Sample Covariance Matrix</span> (<span
                        class="matrixSymbolText">S<sub>XX</sub></span> = <span id="dynEqSymbol">AA<sup>T</sup></span>)
                </div>
                <div class="matrix-container">
                    <span class="matrixSymbolText">S<sub>XX</sub></span> =
                    <div class="matrix">
                        <div class="matrix-row">
                            <span class="matrix-cell" id="s00">2.00</span>
                            <span class="matrix-cell" id="s01">1.00</span>
                        </div>
                        <div class="matrix-row">
                            <span class="matrix-cell" id="s10">1.00</span>
                            <span class="matrix-cell" id="s11">2.00</span>
                        </div>
                    </div>
                </div>
                <div class="formula-text">Determinant |<span class="matrixSymbolText">S<sub>XX</sub></span>| = <span
                        id="detS" class="highlight-s">3.00</span>
                    <span id="genVarLabel">(Generalized Variance)</span>
                </div>
                <div class="formula-text" style="color: #ecf0f1; margin-top: 5px;">|<span
                        class="matrixSymbolText">S<sub>XX</sub></span>| = |<span id="dynProofSymbol">A</span>|² &nbsp; ➔
                    &nbsp; <span id="mathProof">3.00 = 1.73²</span></div>
            </div>
        </div>

        <div class="visualization">
            <canvas id="plotCanvas" width="500" height="500"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('plotCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const scale = 40;

        // UI Elements
        const sVarX = document.getElementById('varX'), sVarY = document.getElementById('varY'), sCorr = document.getElementById('corr');
        const vVarX = document.getElementById('valVarX'), vVarY = document.getElementById('valVarY'), vCorr = document.getElementById('valCorr');

        // Matrix displays
        const t00 = document.getElementById('t00'), t01 = document.getElementById('t01');
        const t10 = document.getElementById('t10'), t11 = document.getElementById('t11');
        const s00 = document.getElementById('s00'), s01 = document.getElementById('s01');
        const s10 = document.getElementById('s10'), s11 = document.getElementById('s11');
        const detT_UI = document.getElementById('detT'), detS_UI = document.getElementById('detS'), proof_UI = document.getElementById('mathProof');

        // Dynamic Text Elements
        const dynTitle = document.getElementById('dynTitle');
        const dynSymbol = document.getElementById('dynSymbol');
        const dynDetSymbol = document.getElementById('dynDetSymbol');
        const dynEqSymbol = document.getElementById('dynEqSymbol');
        const dynProofSymbol = document.getElementById('dynProofSymbol');

        const numPoints = 400;
        const basePoints = [];
        for (let i = 0; i < numPoints; i++) {
            let u1 = Math.random(), u2 = Math.random();
            let z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            let z1 = Math.sqrt(-2.0 * Math.log(u1)) * Math.sin(2.0 * Math.PI * u2);
            basePoints.push({ x: z0, y: z1 });
        }

        function toCanvas(x, y) { return { cx: width / 2 + x * scale, cy: height / 2 - y * scale }; }

        function drawArrow(fromX, fromY, toX, toY, color) {
            const headlen = 10;
            const dx = toX - fromX, dy = toY - fromY;
            const angle = Math.atan2(dy, dx);
            ctx.beginPath();
            ctx.moveTo(fromX, fromY); ctx.lineTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
        }

        function drawGrid() {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = "#e9ecef"; ctx.lineWidth = 1; ctx.beginPath();
            for (let i = 0; i <= width; i += scale) { ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.moveTo(0, i); ctx.lineTo(width, i); }
            ctx.stroke();
            ctx.strokeStyle = "#adb5bd"; ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(width / 2, 0); ctx.lineTo(width / 2, height); ctx.moveTo(0, height / 2); ctx.lineTo(width, height / 2); ctx.stroke();
        }

        function switchMatrixType() {
            const matrixType = document.querySelector('input[name="matrixType"]:checked').value;
            const slideBgMatrix = document.getElementById('slideBgMatrix');
            const lblCov = document.getElementById('lblCov');
            const lblCor = document.getElementById('lblCor');
            const varXSlider = document.getElementById('varX');
            const varYSlider = document.getElementById('varY');
            const groupVarX = document.getElementById('groupVarX');
            const groupVarY = document.getElementById('groupVarY');

            if (matrixType === 'covariance') {
                slideBgMatrix.style.left = '0';
                lblCov.style.color = 'white'; lblCor.style.color = '#495057';
                varXSlider.disabled = false; varYSlider.disabled = false;
                groupVarX.style.opacity = '1'; groupVarY.style.opacity = '1';
                document.getElementById('matrixTitle').innerText = "Sample Covariance Matrix";
                document.querySelectorAll('.matrixSymbolText').forEach(el => el.innerHTML = "S<sub>XX</sub>");
                document.getElementById('genVarLabel').innerText = "(Generalized Variance)";
            } else {
                slideBgMatrix.style.left = '50%';
                lblCor.style.color = 'white'; lblCov.style.color = '#495057';
                varXSlider.disabled = true; varYSlider.disabled = true;
                groupVarX.style.opacity = '0.5'; groupVarY.style.opacity = '0.5';
                document.getElementById('matrixTitle').innerText = "Correlation Matrix";
                document.querySelectorAll('.matrixSymbolText').forEach(el => el.innerHTML = "R");
                document.getElementById('genVarLabel').innerText = "";
            }
            update();
        }

        function switchMode() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const slideBg = document.getElementById('slideBg');
            const lblChol = document.getElementById('lblChol');
            const lblEig = document.getElementById('lblEig');

            if (mode === 'cholesky') {
                slideBg.style.left = '0';
                lblChol.style.color = 'white'; lblEig.style.color = '#495057';
                dynTitle.innerText = "1. Geometric Transformation Matrix (A)";
                dynSymbol.innerText = "A"; dynDetSymbol.innerText = "A";
                dynEqSymbol.innerHTML = "AA<sup>T</sup>"; dynProofSymbol.innerText = "A";
            } else {
                slideBg.style.left = '50%';
                lblEig.style.color = 'white'; lblChol.style.color = '#495057';
                dynTitle.innerText = "2. PCA Unrotated Factor Loadings (Λ)";
                dynSymbol.innerText = "Λ"; dynDetSymbol.innerText = "Λ";
                dynEqSymbol.innerHTML = "ΛΛ<sup>T</sup>"; dynProofSymbol.innerText = "Λ";
            }
            update();
        }

        function update() {
            let varX = parseFloat(sVarX.value), varY = parseFloat(sVarY.value), corr = parseFloat(sCorr.value);
            let mode = document.querySelector('input[name="mode"]:checked').value;
            let matrixType = document.querySelector('input[name="matrixType"]:checked').value;

            vVarX.innerText = varX.toFixed(2); vVarY.innerText = varY.toFixed(2); vCorr.innerText = corr.toFixed(2);

            if (matrixType === 'correlation') {
                varX = 1.0;
                varY = 1.0;
            }

            let covXY = corr * Math.sqrt(varX * varY);
            let detSigma = (varX * varY) - (covXY * covXY);

            let m00, m01, m10, m11, detT;

            if (mode === 'cholesky') {
                m00 = Math.sqrt(varX);
                m01 = 0;
                m10 = covXY / m00;
                m11 = Math.sqrt(Math.max(0, varY - (covXY * covXY) / varX));
                detT = m00 * m11;
            } else {
                let T = varX + varY;
                let lambda1 = (T + Math.sqrt(Math.max(0, T * T - 4 * detSigma))) / 2;
                let lambda2 = (T - Math.sqrt(Math.max(0, T * T - 4 * detSigma))) / 2;
                let angle = (covXY !== 0) ? Math.atan2(lambda1 - varX, covXY) : (varX < varY ? Math.PI / 2 : 0);

                m00 = Math.sqrt(lambda1) * Math.cos(angle);
                m10 = Math.sqrt(lambda1) * Math.sin(angle);
                m01 = Math.sqrt(lambda2) * -Math.sin(angle);
                m11 = Math.sqrt(lambda2) * Math.cos(angle);
                detT = Math.abs(m00 * m11 - m01 * m10); // Absolute area
            }

            // Update Matrix UI
            t00.innerText = m00.toFixed(2); t01.innerText = m01.toFixed(2);
            t10.innerText = m10.toFixed(2); t11.innerText = m11.toFixed(2);
            s00.innerText = varX.toFixed(2); s01.innerText = covXY.toFixed(2);
            s10.innerText = covXY.toFixed(2); s11.innerText = varY.toFixed(2);

            detT_UI.innerText = detT.toFixed(2);
            detS_UI.innerText = detSigma.toFixed(2);
            proof_UI.innerText = `${detSigma.toFixed(2)} = ${detT.toFixed(2)}²`;

            drawGrid();

            // 1. Draw Data Points (ALWAYS using stable Cholesky to prevent spinning bug)
            let L00_chol = Math.sqrt(varX);
            let L10_chol = covXY / L00_chol;
            let L11_chol = Math.sqrt(Math.max(0, varY - (covXY * covXY) / varX));

            ctx.fillStyle = "rgba(52, 152, 219, 0.4)";
            basePoints.forEach(p => {
                let px = L00_chol * p.x;
                let py = L10_chol * p.x + L11_chol * p.y;
                let pt = toCanvas(px, py);
                ctx.beginPath(); ctx.arc(pt.cx, pt.cy, 3, 0, 2 * Math.PI); ctx.fill();
            });

            // 2. Draw Parallelogram (Based on current mode's vectors)
            let origin = toCanvas(0, 0);
            let v1 = toCanvas(m00, m10);
            let v2 = toCanvas(m01, m11);
            let vSum = toCanvas(m00 + m01, m10 + m11);

            ctx.beginPath();
            ctx.moveTo(origin.cx, origin.cy); ctx.lineTo(v1.cx, v1.cy);
            ctx.lineTo(vSum.cx, vSum.cy); ctx.lineTo(v2.cx, v2.cy); ctx.closePath();
            ctx.fillStyle = "rgba(46, 204, 113, 0.2)"; ctx.fill();
            ctx.strokeStyle = "rgba(46, 204, 113, 0.5)"; ctx.lineWidth = 1; ctx.stroke();

            // 3. Draw Covariance Ellipse (ALWAYS using Eigen for correct bounding shape)
            let trace = varX + varY;
            let lambda1_ell = (trace + Math.sqrt(Math.max(0, trace * trace - 4 * detSigma))) / 2;
            let lambda2_ell = (trace - Math.sqrt(Math.max(0, trace * trace - 4 * detSigma))) / 2;
            let angle_ell = (covXY !== 0) ? Math.atan2(lambda1_ell - varX, covXY) : (varX < varY ? Math.PI / 2 : 0);
            let radiusX = 2.4477 * Math.sqrt(lambda1_ell) * scale;
            let radiusY = 2.4477 * Math.sqrt(lambda2_ell) * scale;

            ctx.beginPath();
            ctx.ellipse(width / 2, height / 2, radiusX, radiusY, -angle_ell, 0, 2 * Math.PI);
            ctx.strokeStyle = "rgba(241, 196, 15, 0.8)"; ctx.lineWidth = 3; ctx.stroke();

            // 4. Draw Vectors (Based on current mode)
            drawArrow(origin.cx, origin.cy, v1.cx, v1.cy, "#e74c3c"); // Vector 1 (Red)
            if (m01 !== 0 || m11 !== 0) { // Only draw Vector 2 if it has length
                drawArrow(origin.cx, origin.cy, v2.cx, v2.cy, "#2ecc71"); // Vector 2 (Green)
            }
        }

        sVarX.addEventListener('input', update); sVarY.addEventListener('input', update); sCorr.addEventListener('input', update);
        update();
    </script>
</body>

</html>
